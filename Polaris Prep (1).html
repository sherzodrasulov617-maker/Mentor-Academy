:root[data-theme="dark"]{

.audio{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{background:var(--gold-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.92rem}

  var seen={},all=(a.attempts||[]).concat(b.attempts||[]);
  all.forEach(function(x){var key=x.date+x.test;if(!seen[key]){seen[key]=1;r.attempts.push(x)}});
  r.attempts.sort(function(x,y){return x.date-y.date});r.attempts=r.attempts.slice(-80);
  r.coins=coinsOf(r);r.updated=Date.now();return r;
}
var flushT=null,writing=false;
function persist(now){
  if(!S)return;
  S.coins=coinsOf(S);S.updated=Date.now();
  save('pp_stu_'+sid,S);save('pp_session',S.name);
  if(DB&&!flushT)flushT=setTimeout(push,now?300:20000);
}
function push(){
  flushT=null;
  if(!DB||!S)return;
  if(writing){flushT=setTimeout(push,2000);return}
  writing=true;
  DB.collection('students').doc(sid).set(JSON.parse(JSON.stringify(S))).then(function(){writing=false},function(){writing=false});
}
function pullRemote(){
  if(!DB||!S)return;
  DB.collection('students').doc(sid).get().then(function(snap){
    if(!snap.exists)return persist(true);
    S=mergeStu(S,snap.data());persist(true);renderWho();
  },function(){});
}
function startSession(name){
  sid=slug(name);
  var local=load('pp_stu_'+sid,null);
  S=local?mergeStu(blank(name),local):blank(name);
  S.name=name;persist(true);pullRemote();renderWho();
}
function logout(){push();S=null;sid='';try{localStorage.removeItem('pp_session')}catch(e){}renderWho();location.hash='#home';route()}

/* ---------- runner ---------- */
function paras(t){return t.text.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function head(t,extra){return '<div class="runner-top"><div><div class="row"><span class="tag">'+t.exam+'</span><span class="tag gold">'+esc(t.sec)+'</span></div><h2 style="margin-top:8px">'+esc(t.title)+'</h2></div>'+(extra||'')+'</div>'}
function startCountdown(secs,el,onEnd){
  function tick(){var m=Math.floor(secs/60),s=secs%60;el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;el.className='timer'+(secs<=60?' low':'')}
  tick();
  if(timerId)clearInterval(timerId);
  timerId=setInterval(function(){secs--;tick();if(secs<=0){clearInterval(timerId);timerId=null;onEnd()}},1000);
}
function runner(t){
  currentSec=t.sec;
  if(t.type==='writing')return runWriting(t);
  if(t.type==='speaking')return runSpeaking(t);
  var listening=t.sec==='Listening';
  var qhtml=t.qs.map(function(q,i){
    var body=q.t==='mcq'?q.o.map(function(o,j){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>'}).join(''):
      '<input type="text" id="q'+i+'" autocomplete="off" aria-label="Answer to question '+(i+1)+'" placeholder="Type your answer">';
    return '<div class="q"><div class="stem">'+(i+1)+'. '+esc(q.q)+'</div>'+body+'</div>'}).join('');
  var left=listening?
    '<div class="panel pane"><h3>Audio</h3><div class="audio" style="margin:12px 0"><button class="btn small" id="play">Play audio</button><button class="btn small ghost" id="stop" hidden>Stop</button></div>'+
    '<p class="hint">Listen carefully, then answer. The recording is read aloud by your device. You can play it up to twice.</p><div id="plays" class="hint" style="margin-top:8px"></div>'+
    '<div id="tfall" class="note" style="margin-top:12px" hidden>Audio is not supported on this device. Read the transcript instead.<div class="passage" style="margin-top:8px">'+paras(t)+'</div></div></div>':
    '<div class="panel pane passage" tabindex="0" aria-label="Reading passage"><h3 style="margin-bottom:12px">'+esc(t.title)+'</h3>'+paras(t)+'</div>';
  view.innerHTML=head(t,'<div class="timer" id="timer" role="timer">--:--</div>')+
  '<div class="runner">'+left+'<div class="panel pane">'+qhtml+'<div class="row spread" style="margin-top:14px"><a class="btn ghost" href="#tests">Leave test</a><button class="btn" id="submit">Submit answers</button></div></div></div>';
  startCountdown(t.mins*60,document.getElementById('timer'),finish);
  if(listening){
    var plays=0,playBtn=document.getElementById('play'),stopBtn=document.getElementById('stop'),pl=document.getElementById('plays');
    var ok=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
    if(!ok){document.getElementById('tfall').hidden=false;playBtn.disabled=true}
    playBtn.onclick=function(){
      if(plays>=2||!ok)return;plays++;pl.textContent='Played '+plays+' of 2';
      var u=new SpeechSynthesisUtterance(t.text.join(' '));u.lang='en-GB';u.rate=.92;
      u.onend=function(){stopBtn.hidden=true;playBtn.disabled=plays>=2};
      u.onerror=function(){stopBtn.hidden=true;document.getElementById('tfall').hidden=false};
      try{window.speechSynthesis.cancel();window.speechSynthesis.speak(u);stopBtn.hidden=false;playBtn.disabled=true}catch(e){document.getElementById('tfall').hidden=false}
    };
    stopBtn.onclick=function(){try{window.speechSynthesis.cancel()}catch(e){}stopBtn.hidden=true;playBtn.disabled=plays>=2};
  }
  var finished=false;
  function finish(){
    if(finished)return;finished=true;stopTimer();
    var raw=0,given=[];
    t.qs.forEach(function(q,i){
      var g,right=false;
      if(q.t==='mcq'){var c=view.querySelector('input[name="q'+i+'"]:checked');g=c?+c.value:-1;right=g===q.a}
      else{g=norm(document.getElementById('q'+i).value);right=q.a.some(function(a){return norm(a)===g})}
      if(right)raw++;given.push(g)});
    var total=t.qs.length,pct=raw/total*100;
    var rec={test:t.id,title:t.title,exam:t.exam,sec:t.sec,raw:raw,total:total,pct:pct,grade:grade(t,raw,total),date:Date.now()};
    record(rec,pct);
    showResult(t,rec,given);
  }
  document.getElementById('submit').onclick=finish;
}
function record(rec,score){
  S.attempts.push(rec);S.attempts=S.attempts.slice(-80);
  var k=rec.sec;
  S.cnt[k]=(S.cnt[k]||0)+1;
  S.done[k]=Math.max(S.done[k]==null?-1:S.done[k],score);
  persist(true);
}
function showResult(t,rec,given){
  var rev=t.qs.map(function(q,i){
    var g=given[i],right,yours,correct;
    if(q.t==='mcq'){right=g===q.a;yours=g>=0?q.o[g]:'No answer';correct=q.o[q.a]}
    else{right=q.a.some(function(a){return norm(a)===g});yours=g||'No answer';correct=q.a[0]}
    return '<div class="q '+(right?'ok':'no')+'"><div class="stem">'+(i+1)+'. '+esc(q.q)+'</div><div class="ans '+(right?'good':'bad')+'">Your answer: '+esc(yours)+'</div>'+(right?'':'<div class="ans good">Correct answer: '+esc(correct)+'</div>')+'</div>'}).join('');
  view.innerHTML='<div class="panel result-head"><div class="score">'+rec.raw+'/'+rec.total+'</div><div><div class="kicker">'+t.exam+' · '+esc(t.sec)+'</div><h2>'+esc(rec.grade)+'</h2><p class="hint" style="margin-top:6px">'+Math.round(rec.pct)+'% correct on “'+esc(t.title)+'”.</p></div></div>'+
  rewardNote(t.sec)+
  '<div class="row"><a class="btn" href="#test-'+esc(t.id)+'">Retake</a><a class="btn ghost" href="#tests">More tests</a></div>'+
  '<div class="panel review"><h3 style="margin-bottom:6px">Answer review</h3>'+rev+'</div>';
  window.scrollTo(0,0);
}
function rewardNote(sec){
  if(S.claimed[sec])return '';
  return '<div class="note">You finished a '+esc(sec)+' test. <a href="#rewards">Claim your '+COIN+' coins</a> on the Rewards page.</div>';
}
function runWriting(t){
  var min=t.minWords||100;
  view.innerHTML=head(t,'<div class="timer" id="timer" role="timer">--:--</div>')+
  '<div class="runner"><div class="panel pane passage" tabindex="0"><h3 style="margin-bottom:12px">Task</h3>'+paras(t)+'</div>'+
  '<div class="panel pane"><div class="field"><label for="essay">Your answer</label><textarea id="essay" style="min-height:300px" placeholder="Start writing here"></textarea></div>'+
  '<div class="row spread"><span class="hint" id="wc">0 / '+min+' words</span><div class="row"><a class="btn ghost" href="#tests">Leave</a><button class="btn" id="wsub" disabled>Submit writing</button></div></div></div></div>';
  var ta=document.getElementById('essay'),btn=document.getElementById('wsub'),wc=document.getElementById('wc'),done=false;
  ta.oninput=function(){var n=words(ta.value);wc.textContent=n+' / '+min+' words';btn.disabled=n<min};
  function submit(){
    if(done)return;var n=words(ta.value);if(n<min)return;done=true;stopTimer();
    var rec={test:t.id,title:t.title,exam:t.exam,sec:t.sec,raw:n,total:min,pct:100,grade:'Submitted · '+n+' words',words:n,date:Date.now()};
    record(rec,100);
    view.innerHTML='<div class="panel result-head"><div class="score">'+n+'</div><div><div class="kicker">'+t.exam+' · Writing</div><h2>Writing submitted</h2><p class="hint" style="margin-top:6px">'+n+' words on “'+esc(t.title)+'”. Your teacher can see that you completed it.</p></div></div>'+rewardNote(t.sec)+'<div class="row"><a class="btn" href="#tests">More tests</a></div>';
  }
  btn.onclick=submit;
  startCountdown(t.mins*60,document.getElementById('timer'),function(){if(words(ta.value)>=min)submit();else wc.textContent='Time is up. Reach '+min+' words to submit.'});
}
function runSpeaking(t){
  var prep=t.prep||60,talk=t.talk||120,phase=0,talked=0,talkTick=null;
  view.innerHTML=head(t,'<div class="timer" id="timer" role="timer">'+'--:--'+'</div>')+
  '<div class="panel"><h3 style="margin-bottom:12px">Cue card</h3><div class="passage">'+paras(t)+'</div></div>'+
  '<div class="panel"><p id="sp" class="hint" style="margin-bottom:12px">Press start when you are ready. You have '+Math.round(prep/60)+' minute to prepare, then speak aloud for up to '+Math.round(talk/60)+' minutes. Nothing is recorded.</p>'+
  '<div class="row"><button class="btn" id="sgo">Start preparation</button><button class="btn" id="sfin" hidden disabled>Finish speaking</button><a class="btn ghost" href="#tests">Leave</a></div></div>';
  var el=document.getElementById('timer'),sp=document.getElementById('sp'),go=document.getElementById('sgo'),fin=document.getElementById('sfin');
  el.textContent=Math.floor(prep/60)+':00';
  function speak(){
    phase=2;go.hidden=true;fin.hidden=false;sp.textContent='Speak now. Finish when you are done (available after 30 seconds).';
    talkTick=setInterval(function(){talked++;if(talked>=30)fin.disabled=false},1000);
    startCountdown(talk,el,finishSpeaking);
  }
  function finishSpeaking(){
    if(phase===3)return;phase=3;stopTimer();if(talkTick)clearInterval(talkTick);
    var rec={test:t.id,title:t.title,exam:t.exam,sec:t.sec,raw:1,total:1,pct:100,grade:'Completed · '+Math.round(talked/6)/10+' min spoken',date:Date.now()};
    record(rec,100);
    view.innerHTML='<div class="panel result-head"><div class="score">Done</div><div><div class="kicker">'+t.exam+' · Speaking</div><h2>Speaking completed</h2><p class="hint" style="margin-top:6px">You spoke for about '+Math.max(1,Math.round(talked/6)/10)+' minutes on “'+esc(t.title)+'”.</p></div></div>'+rewardNote(t.sec)+'<div class="row"><a class="btn" href="#tests">More tests</a></div>';
  }
  go.onclick=function(){
    if(phase===0){phase=1;go.textContent='Skip to speaking';sp.textContent='Prepare your ideas. Speaking starts automatically when the timer ends.';startCountdown(prep,el,speak)}
    else if(phase===1){stopTimer();speak()}
  };
  fin.onclick=finishSpeaking;
}

function avgBest(st){var v=[];SECS.forEach(function(k){if(st.done&&st.done[k]!=null)v.push(st.done[k])});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:0}
function localStudents(){
  var out=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pp_stu_')===0){try{out.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}}catch(e){}
  return out;
}
function students(){
  var map={};
  (ALL||[]).forEach(function(s){map[slug(s.name)]=s});
  localStudents().forEach(function(s){var k=slug(s.name);map[k]=map[k]?mergeStu(map[k],s):s});
  return Object.keys(map).map(function(k){return map[k]});
}
function leaderboard(){
  var rows=students().map(function(s){return {name:s.name,coins:coinsOf(s),avg:avgBest(s),mine:S&&slug(s.name)===sid}});
  if(rows.length<3)SAMPLE.forEach(function(x){rows.push({name:x[0],coins:x[1],avg:x[2],sample:true})});
  rows.sort(function(a,b){return b.coins-a.coins||b.avg-a.avg});
  view.innerHTML='<div><h2>Leaderboard</h2><p class="hint">Ranked by coins, then average best score. Rows tagged “example” are sample entries.</p></div>'+
  '<div class="panel scroll-x"><table class="table"><thead><tr><th>Rank</th><th>Student</th><th>Coins</th><th>Avg best</th></tr></thead><tbody>'+
  rows.map(function(r,i){return '<tr class="'+(r.mine?'me':'')+'"><td><span class="rank'+(i===0?' r1':'')+'">'+(i+1)+'</span></td><td>'+esc(r.name)+(r.sample?' <span class="tag">example</span>':'')+'</td><td>'+r.coins+'</td><td>'+Math.round(r.avg)+'%</td></tr>'}).join('')+'</tbody></table></div>';
}

/* ---------- teacher ---------- */
var selSid=null;
function teacher(){
  if(!mem.teacher){
    view.innerHTML='<div><h2>Teacher login</h2><p class="hint">Sign in to see student time, results and rewards.</p></div><div class="panel" style="max-width:420px"><div class="field"><label for="pw">Teacher password</label><input id="pw" type="password" autocomplete="off"></div><div class="row spread"><button class="btn" id="login">Sign in</button><a href="#home">Student login</a></div><p id="err" class="hint" style="margin-top:10px;color:var(--bad)" hidden>Wrong password.</p></div>';
    var go=function(){if(document.getElementById('pw').value===TEACHER_PW){mem.teacher=true;teacher()}else document.getElementById('err').hidden=false};
    document.getElementById('login').onclick=go;
    document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go()};
    return;
  }
  var c=getCustom();
  view.innerHTML='<div class="row spread"><div><h2>Teacher panel</h2><p class="hint" id="tsrc"></p></div><button class="btn ghost small" id="out">Sign out</button></div>'+
  '<div id="tdata"></div>'+
  '<details class="panel"><summary>Add a test</summary><div style="margin-top:14px">'+
  '<div class="field"><label for="tt">Title</label><input id="tt" placeholder="e.g. Hotel booking call"></div>'+
  '<div class="row"><div class="field" style="flex:1;min-width:140px"><label for="te">Exam</label><select id="te"><option>IELTS</option><option>Multilevel</option></select></div>'+
  '<div class="field" style="flex:1;min-width:140px"><label for="ts">Section</label><select id="ts">'+SECS.map(function(k){return '<option>'+k+'</option>'}).join('')+'</select></div>'+
  '<div class="field" style="flex:1;min-width:140px"><label for="tm">Minutes</label><input id="tm" type="number" min="1" max="90" value="10"></div></div>'+
  '<div class="field"><label for="tx">Passage, transcript or task text</label><textarea id="tx" placeholder="Separate paragraphs with a blank line."></textarea></div>'+
  '<div class="field"><label for="tq">Questions, one per line (not needed for Writing and Speaking)</label><textarea id="tq" placeholder="Multiple choice:  Question | Option A ; Option B ; Option C | 2\nGap fill:  Question with ____ | = answer ; other accepted answer"></textarea><span class="hint">For multiple choice, the last number is the position of the correct option (1 = first).</span></div>'+
  '<p id="terr" class="hint" style="color:var(--bad);margin-bottom:10px" hidden></p><button class="btn" id="add">Publish test</button></div></details>'+
  '<div class="panel"><h3 style="margin-bottom:10px">Tests you added ('+c.length+')</h3>'+(c.length?c.map(function(t,i){return '<div class="row spread q"><span><b>'+esc(t.title)+'</b> <span class="hint">'+t.exam+' · '+esc(t.sec)+'</span></span><button class="btn ghost small" data-del="'+i+'">Delete</button></div>'}).join(''):'<p class="hint">Nothing added yet. Tests you add appear in this browser.</p>')+'</div>';
  renderTData();
  document.getElementById('out').onclick=function(){mem.teacher=false;teacher()};
  view.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){c.splice(+b.dataset.del,1);mem.custom=c;save('pp_custom',c);teacher()}});
  document.getElementById('add').onclick=function(){
    var err=document.getElementById('terr');
    function bad(m){err.textContent=m;err.hidden=false}
    var title=document.getElementById('tt').value.trim(),text=document.getElementById('tx').value.trim(),sec=document.getElementById('ts').value;
    var lines=document.getElementById('tq').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(!title)return bad('Add a title.');
    if(!text)return bad('Add the passage, transcript or task text.');
    var base={id:'c'+Date.now().toString(36),exam:document.getElementById('te').value,sec:sec,title:title,mins:Math.max(1,+document.getElementById('tm').value||10),text:text.split(/\n\s*\n/).map(function(x){return x.trim()}).filter(Boolean)};
    if(sec==='Writing'){base.type='writing';base.minWords=100}
    else if(sec==='Speaking'){base.type='speaking';base.prep=60;base.talk=120}
    else{
      base.type='quiz';var qs=[];
      for(var i=0;i<lines.length;i++){
        var p=lines[i].split('|').map(function(x){return x.trim()});
        if(p.length>=3&&/^\d+$/.test(p[2])){
          var o=p[1].split(';').map(function(x){return x.trim()}).filter(Boolean),a=+p[2]-1;
          if(o.length<2||a<0||a>=o.length)return bad('Line '+(i+1)+': check the options and the correct number.');
          qs.push({t:'mcq',q:p[0],o:o,a:a});
        }else if(p.length>=2&&p[1].charAt(0)==='='){
          var ans=p[1].slice(1).split(';').map(function(x){return x.trim()}).filter(Boolean);
          if(!ans.length)return bad('Line '+(i+1)+': add at least one accepted answer after "=".');
          qs.push({t:'fill',q:p[0],a:ans});
        }else return bad('Line '+(i+1)+' does not match either format.');
      }
      if(!qs.length)return bad('Add at least one question.');
      base.qs=qs;
    }
    c.push(base);mem.custom=c;save('pp_custom',c);teacher();
  };
}
function cell(st,k){
  if(st.done&&st.done[k]!=null){
    var n=(st.cnt||{})[k]||0;
    return (k==='Writing'||k==='Speaking'?'✓':Math.round(st.done[k])+'%')+(n?' <span class="hint">('+n+')</span>':'');
  }
  return '<span class="hint">–</span>';
}
function renderTData(){
  var box=document.getElementById('tdata');if(!box)return;
  var src=document.getElementById('tsrc');
  if(src)src.textContent=DB?'Live data from all students who logged in with a Claude account. Click a row for details.':'Shared data is not available in this view, so only students who used this browser are listed.';
  var list=students().sort(function(a,b){return (b.seconds||0)-(a.seconds||0)});
  var totalSec=list.reduce(function(a,s){return a+(s.seconds||0)},0);
  var html='<div class="panel stats" style="margin-bottom:16px"><div><b>'+list.length+'</b><span>Students</span></div><div><b>'+fmtTime(totalSec)+'</b><span>Total practice time</span></div><div><b>'+list.reduce(function(a,s){return a+coinsOf(s)},0)+'</b><span>Coins earned</span></div></div>';
  html+='<div class="panel scroll-x"><table class="table"><thead><tr><th>Student</th><th>Time</th><th>Coins</th>'+SECS.map(function(k){return '<th>'+k+'</th>'}).join('')+'</tr></thead><tbody>'+
  (list.length?list.map(function(s){var k=slug(s.name);return '<tr class="pick'+(k===selSid?' sel':'')+'" data-sid="'+esc(k)+'" tabindex="0"><td><b>'+esc(s.name)+'</b></td><td>'+fmtTime(s.seconds)+'</td><td>'+coinsOf(s)+'</td>'+SECS.map(function(x){return '<td>'+cell(s,x)+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="9" class="hint">No students yet. Students appear after they log in with the class password.</td></tr>')+'</tbody></table></div>'+
  '<p class="hint" style="margin-top:8px">Cells show the best score in each section and, in brackets, how many attempts. A tick means Writing or Speaking was completed.</p>';
  var sel=null;list.forEach(function(s){if(slug(s.name)===selSid)sel=s});
  if(sel){
    html+='<div class="panel" style="margin-top:16px"><h3 style="margin-bottom:10px">'+esc(sel.name)+'</h3><p class="hint" style="margin-bottom:10px">Time by section: '+SECS.map(function(k){return k+' '+fmtTime((sel.secBy||{})[k])}).join(' · ')+'</p>'+
    '<div class="scroll-x"><table class="table"><thead><tr><th>Date</th><th>Test</th><th>Section</th><th>Result</th></tr></thead><tbody>'+
    ((sel.attempts||[]).length?(sel.attempts||[]).slice().reverse().map(function(r){return '<tr><td>'+new Date(r.date).toLocaleDateString()+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.sec)+'</td><td>'+esc(r.grade)+'</td></tr>'}).join(''):'<tr><td colspan="4" class="hint">No attempts yet.</td></tr>')+'</tbody></table></div></div>';
  }
  box.innerHTML=html;
  box.querySelectorAll('tr.pick').forEach(function(r){
    var pick=function(){selSid=selSid===r.dataset.sid?null:r.dataset.sid;renderTData()};
    r.onclick=pick;r.onkeydown=function(e){if(e.key==='Enter')pick()};
  });
}

if(last){sid=slug(last);var l=load('pp_stu_'+sid,null);if(l){S=mergeStu(blank(last),l);S.name=last}}
renderWho();
route();
})();
</script>
